<title>{{WORLD}} Known World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra+SC&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/*LEAFLET_CSS*/
</style>
<style>
:root {
  color-scheme: dark;
  --fog: #35322a;
  --panel: rgba(22, 20, 17, 0.93);
  --panel-solid: #16140f;
  --ink: #efe6d2;
  --muted: #a99d87;
  --rule: #3b352c;
  --chip: #26221c;
  --chip-on: #3a3226;
  --gold: #e9bb5e;
  --rune: #5ec7d6;
  --fire: #ef8c2d;
  --hildir: #c38be6;
  --red: #d8342c;
  --display: "Almendra SC", "Palatino Linotype", Palatino, Georgia, serif;
  --body: "Alegreya Sans", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--fog);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  overflow: hidden;
}
#map { position: absolute; inset: 0; background: var(--fog); }
.leaflet-container { font-family: var(--body); background: var(--fog); }
.leaflet-control-attribution { display: none; }

/* ---------- panel ---------- */
#panel {
  position: absolute; z-index: 1000;
  top: calc(env(safe-area-inset-top, 0px) + 16px); left: 16px;
  width: 320px; max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 10px;
  box-shadow: 0 10px 40px rgba(0,0,0,.45);
  backdrop-filter: blur(6px);
}
.head { padding: 16px 18px 12px; display: grid; gap: 4px; }
.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.05; letter-spacing: .01em; text-wrap: balance; }
.stats { color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.4; }
.stats b { color: var(--ink); font-weight: 500; }
.headrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
#toggle {
  display: none; flex: none;
  background: var(--chip); color: var(--ink); border: 1px solid var(--rule);
  border-radius: 6px; padding: 6px 10px; font: 500 13px var(--body); cursor: pointer;
}
.body { display: flex; flex-direction: column; min-height: 0; border-top: 1px solid var(--rule); }
.filters { padding: 12px 18px 4px; display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--chip); color: var(--muted);
  border: 1px solid var(--rule); border-radius: 999px;
  padding: 3px 10px 3px 6px; font: 500 13px var(--body); cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.chip svg { width: 16px; height: 16px; opacity: .45; }
.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--ink); border-color: #5a4d39; }
.chip[aria-pressed="true"] svg { opacity: 1; }
.chip:focus-visible, .row:focus-visible, #toggle:focus-visible, .sw input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }
.switches { padding: 8px 18px 4px; display: flex; gap: 16px; color: var(--muted); font-size: 13px; }
.sw { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.sw input { accent-color: var(--gold); margin: 0; }
.search { padding: 10px 18px; }
.search input {
  width: 100%; box-sizing: border-box;
  background: var(--panel-solid); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 6px;
  padding: 8px 10px; font: 15px var(--body);
}
.search input::placeholder { color: #7d7362; }
.search input:focus { outline: 2px solid var(--gold); outline-offset: 0; border-color: transparent; }
#list { list-style: none; margin: 0; padding: 0 8px 8px; overflow-y: auto; min-height: 0; flex: 1; }
.row {
  display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center;
  padding: 6px 10px; border-radius: 6px; cursor: pointer;
}
.row:hover { background: #2a251e; }
.row svg { width: 18px; height: 18px; }
.row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .co { color: #857a67; font-size: 12px; font-variant-numeric: tabular-nums; }
.row.done .nm { text-decoration: line-through; text-decoration-color: var(--red); color: var(--muted); }
.empty { padding: 8px 12px 14px; color: var(--muted); }
.foot { padding: 10px 18px 14px; border-top: 1px solid var(--rule); color: #857a67; font-size: 12px; line-height: 1.45; }

/* ---------- map furniture ---------- */
#coords, #scale {
  position: absolute; z-index: 900; font-variant-numeric: tabular-nums;
  color: var(--ink); font-size: 12px; text-shadow: 0 1px 2px #000, 0 0 4px #000;
}
#coords { right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
#scale { right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 34px); display: grid; justify-items: end; gap: 3px; }
#scale .bar { height: 5px; border: 1.5px solid #f3ead6; border-top: none; box-shadow: 0 1px 2px #000; }
.leaflet-control-zoom { border: 1px solid var(--rule) !important; box-shadow: none !important; }
.leaflet-control-zoom a { background: var(--panel-solid) !important; color: var(--ink) !important; border-bottom-color: var(--rule) !important; }
.leaflet-top.leaflet-right { top: env(safe-area-inset-top, 0px); }

.pin { background: none; border: none; }
.pin svg { width: 100%; height: 100%; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.8)); }
.pin.done svg { opacity: .8; }
.lbl.leaflet-tooltip {
  background: none; border: none; box-shadow: none; padding: 0 2px;
  color: #f7f0de; font: 700 12.5px var(--body); letter-spacing: .01em;
  text-shadow: 0 0 3px #0e0b08, 0 0 3px #0e0b08, 0 1px 2px #0e0b08;
}
.lbl.leaflet-tooltip::before { display: none; }
.lbl.boss { color: var(--gold); font-size: 14.5px; }
.lbl.hildir { color: #dcb6f5; font-size: 14px; }
.lbl.done { color: #bdb3a0; text-decoration: line-through; text-decoration-color: var(--red); }
.lbl.off { visibility: hidden; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel-solid); color: var(--ink); border: 1px solid var(--rule); box-shadow: 0 6px 24px rgba(0,0,0,.5); }
.leaflet-popup-content { margin: 12px 14px; font: 14px var(--body); line-height: 1.4; }
.pop h3 { margin: 0 0 2px; font: 700 16px var(--body); }
.pop .k { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.pop .x { color: #ef6a60; font-size: 12.5px; }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }

@media (max-width: 640px) {
  #panel { left: 16px; right: 16px; width: auto; max-height: 55%; }
  h1 { font-size: 24px; }
  #toggle { display: inline-block; }
  #panel.collapsed .body, #panel.collapsed .foot { display: none; }
  #coords { display: none; }
  #scale { bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>
<body>
<div id="map" aria-label="Map of the explored world"></div>

<section id="panel">
  <div class="head">
    <div class="headrow">
      <div>
        <div class="eyebrow">Valheim · Known world</div>
        <h1 id="wname">{{WORLD}}</h1>
      </div>
      <button id="toggle" type="button" aria-expanded="true" aria-controls="panelbody">Hide</button>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="body" id="panelbody">
    <div class="filters" id="filters" role="group" aria-label="Pin types"></div>
    <div class="switches">
      <label class="sw"><input type="checkbox" id="sw-labels" checked><span>Labels</span></label>
      <label class="sw"><input type="checkbox" id="sw-done" checked><span>Crossed off</span></label>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Find a pin: tumba, copper, porto…" autocomplete="off" aria-label="Search pins"></div>
    <ul id="list"></ul>
  </div>
  <div class="foot">Everything recorded at the cartography tables. Unrecorded ground stays under fog. Boss sites read from runestones show through it, the same as in game. Coordinates are in-game x, z.</div>
</section>

<div id="scale"><span id="scale-t">1 km</span><div class="bar" id="scale-b"></div></div>
<div id="coords"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const D = /*DATA*/null;

// ---------- pin types ----------
const TYPES = {
  boss:   { ids: [9],          label: 'Bosses',  prio: 0 },
  hildir: { ids: [14, 15, 16], label: 'Hildir',  prio: 2 },
  fire:   { ids: [0],          label: 'Fire',    prio: 2 },
  house:  { ids: [1],          label: 'House',   prio: 2 },
  hammer: { ids: [2],          label: 'Hammer',  prio: 3 },
  rune:   { ids: [6],          label: 'Rune',    prio: 3 },
  dot:    { ids: [3],          label: 'Dot',     prio: 3 },
  other:  { ids: [],           label: 'Other',   prio: 3 },
};
const kindOf = t => Object.keys(TYPES).find(k => TYPES[k].ids.includes(t)) || 'other';
const OL = '#17120c';
const SVG = {
  boss:   `<svg viewBox="-12 -12 24 24"><circle r="10" fill="#a8201d" stroke="#f4cf7e" stroke-width="2.2"/><path d="M-6.5-1-9-9.5-2.5-5ZM6.5-1 9-9.5 2.5-5Z" fill="#f4cf7e"/><circle cx="-3" cy="2" r="1.6" fill="#f4cf7e"/><circle cx="3" cy="2" r="1.6" fill="#f4cf7e"/></svg>`,
  hildir: `<svg viewBox="-12 -12 24 24"><path d="M0-11 2.9-4 10.5-3.4 4.7 1.6 6.5 9 0 5 -6.5 9 -4.7 1.6 -10.5-3.4 -2.9-4Z" fill="#c38be6" stroke="${OL}" stroke-width="1.4"/></svg>`,
  fire:   `<svg viewBox="-12 -12 24 24"><path d="M0-10.5C4 -6 8.5-2.5 7.5 3 6.8 7 3.5 9.5 0 9.5s-6.8-2.5-7.5-6.5C-8.5-2.5-4-4 0-10.5Z" fill="#ef8c2d" stroke="${OL}" stroke-width="1.4"/><path d="M0-1C2 1.5 3.5 3 3 5.5 2.5 7.5 1.2 8 0 8s-2.5-.5-3-2.5C-3.5 3-2 1.5 0-1Z" fill="#ffe08a"/></svg>`,
  house:  `<svg viewBox="-12 -12 24 24"><path d="M0-10 10-1H7v10H-7V-1H-10Z" fill="#ece2c8" stroke="${OL}" stroke-width="1.4"/><rect x="-2.2" y="3" width="4.4" height="6" fill="#6b4a2b"/></svg>`,
  hammer: `<svg viewBox="-12 -12 24 24"><rect x="-9" y="-9.5" width="18" height="6.5" rx="1" fill="#cfd0d6" stroke="${OL}" stroke-width="1.4"/><rect x="-2" y="-3" width="4" height="13" fill="#9a6a3c" stroke="${OL}" stroke-width="1.4"/></svg>`,
  rune:   `<svg viewBox="-12 -12 24 24"><path d="M0-11 8.5 0 0 11-8.5 0Z" fill="#5ec7d6" stroke="${OL}" stroke-width="1.4"/><path d="M0-5.5V5.5M0-2 3-4.5M0 1.5-3-1" stroke="${OL}" stroke-width="1.6" fill="none"/></svg>`,
  dot:    `<svg viewBox="-12 -12 24 24"><circle r="6.5" fill="#fbf6ea" stroke="${OL}" stroke-width="2"/></svg>`,
  other:  `<svg viewBox="-12 -12 24 24"><circle r="6.5" fill="#a99d87" stroke="${OL}" stroke-width="2"/></svg>`,
};
const XMARK = `<path d="M-10-10 10 10M-10 10 10-10" stroke="#d8342c" stroke-width="3.2" stroke-linecap="round"/>`;
const iconSvg = (k, done) => done ? SVG[k].replace('</svg>', XMARK + '</svg>') : SVG[k];

// ---------- coordinates ----------
const Z = D.nativeZ, S = 2 ** Z;
const toLL = (x, z) => L.latLng(-((D.north - z) / D.mpp) / S, ((x - D.west) / D.mpp) / S);
const toWorld = ll => ({ x: D.west + ll.lng * S * D.mpp, z: D.north + ll.lat * S * D.mpp });
const imgBounds = L.latLngBounds(L.latLng(-D.ny / S, 0), L.latLng(0, D.nx / S));
const fmt = v => Math.round(v).toLocaleString('en-US');

// ---------- map ----------
const map = L.map('map', {
  crs: L.CRS.Simple, zoomSnap: 0.25, zoomDelta: 0.5, minZoom: -1, maxZoom: 7,
  attributionControl: false, zoomControl: false,
});
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('tiles/{z}/{x}/{y}.webp', {
  tileSize: D.tile, minNativeZoom: 0, maxNativeZoom: Z, minZoom: -1, maxZoom: 7,
  noWrap: true, bounds: L.latLngBounds(L.latLng(-D.ny / S + 0.02, 0.02), L.latLng(-0.02, D.nx / S - 0.02)), keepBuffer: 4,
}).addTo(map);

const allLL = D.pins.map(p => toLL(p.x, p.z));
const outer = imgBounds.extend(L.latLngBounds(allLL)).pad(0.15);
map.setMaxBounds(outer);

const narrow = () => window.matchMedia('(max-width: 640px)').matches;
function fitHome() {
  const pad = narrow() ? { tl: [16, 140], br: [16, 16] } : { tl: [360, 16], br: [60, 16] };
  map.fitBounds(imgBounds, { paddingTopLeft: pad.tl, paddingBottomRight: pad.br, animate: false });
}
fitHome();

// ---------- pins ----------
const state = { on: new Set(Object.keys(TYPES)), labels: true, done: true, q: '' };
const pins = D.pins.map((p, i) => {
  const k = kindOf(p.t);
  const big = k === 'boss' || k === 'hildir';
  const sz = big ? 26 : 20;
  const m = L.marker(toLL(p.x, p.z), {
    icon: L.divIcon({ className: 'pin' + (p.c ? ' done' : ''), html: iconSvg(k, p.c), iconSize: [sz, sz], iconAnchor: [sz / 2, sz / 2] }),
    keyboard: false, title: p.n || TYPES[k].label, riseOnHover: true,
    zIndexOffset: big ? 1000 : (TYPES[k].prio === 2 ? 500 : 0),
  });
  const cls = 'lbl' + (k === 'boss' ? ' boss' : k === 'hildir' ? ' hildir' : '') + (p.c ? ' done' : '');
  if (p.n) m.bindTooltip(p.n, { permanent: true, direction: 'right', offset: [sz / 2 + 1, 0], className: cls, interactive: false });
  const raw = p.raw && p.raw.trim() !== p.n ? `<div class="k">Written as “${esc(p.raw.trim())}”</div>` : '';
  m.bindPopup(`<div class="pop"><h3>${esc(p.n || 'Unnamed ' + TYPES[k].label.toLowerCase() + ' pin')}</h3>
    <div class="k">${TYPES[k].label} pin · x ${fmt(p.x)}, z ${fmt(p.z)}</div>${raw}${p.c ? '<div class="x">Crossed off</div>' : ''}</div>`,
    { offset: [0, -sz / 2 + 2], closeButton: true });
  return { ...p, i, k, m, prio: TYPES[k].prio };
});
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

const layer = L.layerGroup().addTo(map);
const visible = p => state.on.has(p.k) && (state.done || !p.c);

function refreshPins() {
  layer.clearLayers();
  pins.filter(visible).forEach(p => layer.addLayer(p.m));
  requestAnimationFrame(declutter);
}

// Label rules: bosses/Hildir always; fires & houses from mid zoom; everything named when zoomed in.
// Then hide any label that collides with a higher-priority one already placed.
function declutter() {
  const z = map.getZoom();
  const minPrio = z >= 3.5 ? 3 : z >= 2.25 ? 2 : 0;
  const placed = [];
  const seen = [];
  const order = pins.filter(p => visible(p) && p.n).sort((a, b) => a.prio - b.prio);
  for (const p of order) {
    const tt = p.m.getTooltip(); const el = tt && tt.getElement();
    if (!el) continue;
    let show = state.labels && p.prio <= minPrio;
    if (show) {
      const pt = map.latLngToContainerPoint(p.m.getLatLng());
      if (seen.some(s => s.n === p.n.toLowerCase() && Math.abs(s.x - pt.x) < 90 && Math.abs(s.y - pt.y) < 60)) show = false;
      if (show) {
        const r = el.getBoundingClientRect();
        if (placed.some(q => r.left < q.right && r.right > q.left && r.top < q.bottom && r.bottom > q.top)) show = false;
        else { placed.push(r); seen.push({ n: p.n.toLowerCase(), x: pt.x, y: pt.y }); }
      }
    }
    el.classList.toggle('off', !show);
  }
}
map.on('zoomend moveend', () => requestAnimationFrame(declutter));

// ---------- panel ----------
document.getElementById('stats').innerHTML =
  `<b>${D.km2} km²</b> charted · <b>${D.pins.length}</b> pins · as of ${D.asOf}`;

const counts = {};
pins.forEach(p => counts[p.k] = (counts[p.k] || 0) + 1);
const fbox = document.getElementById('filters');
Object.keys(TYPES).filter(k => counts[k]).forEach(k => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chip'; b.id = 'f-' + k;
  b.setAttribute('aria-pressed', 'true');
  b.innerHTML = `${SVG[k]}<span>${TYPES[k].label}</span><span>${counts[k]}</span>`;
  b.onclick = () => {
    const on = !state.on.has(k);
    on ? state.on.add(k) : state.on.delete(k);
    b.setAttribute('aria-pressed', String(on));
    refreshPins(); renderList();
  };
  fbox.appendChild(b);
});
document.getElementById('sw-labels').onchange = e => { state.labels = e.target.checked; declutter(); };
document.getElementById('sw-done').onchange = e => { state.done = e.target.checked; refreshPins(); renderList(); };

const list = document.getElementById('list');
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function renderList() {
  const q = norm(state.q.trim());
  const rows = pins.filter(p => visible(p) && (!q || norm(p.n || '').includes(q) || norm(TYPES[p.k].label).includes(q)))
    .sort((a, b) => a.prio - b.prio || (a.n ? 0 : 1) - (b.n ? 0 : 1) || a.n.localeCompare(b.n, 'pt'));
  list.innerHTML = rows.length ? '' : '<li class="empty">No pins match.</li>';
  const frag = document.createDocumentFragment();
  rows.forEach(p => {
    const li = document.createElement('li');
    li.className = 'row' + (p.c ? ' done' : ''); li.tabIndex = 0;
    li.innerHTML = `${SVG[p.k]}<span class="nm">${esc(p.n || 'Unnamed ' + TYPES[p.k].label.toLowerCase())}</span><span class="co">${fmt(p.x)}, ${fmt(p.z)}</span>`;
    const go = () => {
      if (narrow()) setCollapsed(true);
      map.flyTo(p.m.getLatLng(), Math.max(map.getZoom(), 4.5), { duration: matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 0.8 });
      map.once('moveend', () => p.m.openPopup());
    };
    li.onclick = go;
    li.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
    frag.appendChild(li);
  });
  list.appendChild(frag);
}
document.getElementById('q').oninput = e => { state.q = e.target.value; renderList(); };

const panel = document.getElementById('panel'), tog = document.getElementById('toggle');
function setCollapsed(c) {
  panel.classList.toggle('collapsed', c);
  tog.textContent = c ? 'Pins' : 'Hide';
  tog.setAttribute('aria-expanded', String(!c));
}
tog.onclick = () => setCollapsed(!panel.classList.contains('collapsed'));
if (narrow()) setCollapsed(true);
L.DomEvent.disableClickPropagation(panel);
L.DomEvent.disableScrollPropagation(panel);

// ---------- scale bar + cursor coords ----------
const scaleT = document.getElementById('scale-t'), scaleB = document.getElementById('scale-b');
function updScale() {
  const mPerPx = D.mpp * 2 ** (Z - map.getZoom());
  const target = mPerPx * 110;
  const nice = [10, 20, 50, 100, 200, 250, 500, 1000, 2000, 5000].reduce((a, v) => v <= target ? v : a, 10);
  scaleB.style.width = (nice / mPerPx) + 'px';
  scaleT.textContent = nice >= 1000 ? (nice / 1000) + ' km' : nice + ' m';
}
map.on('zoom', updScale); updScale();
const coords = document.getElementById('coords');
map.on('mousemove', e => { const w = toWorld(e.latlng); coords.textContent = `x ${fmt(w.x)}   z ${fmt(w.z)}`; });
map.on('mouseout', () => coords.textContent = '');

refreshPins(); renderList();
</script>
</body>
